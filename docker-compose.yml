services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ipl
      POSTGRES_PASSWORD: ipl
      POSTGRES_DB: ipl
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/01_schemas.sql:/docker-entrypoint-initdb.d/01_schemas.sql
volumes:
  pgdata: